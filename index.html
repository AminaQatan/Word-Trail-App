function icon(name){const s='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';const paths={book:'<path d="M3 5c4-2 6-1 9 1 3-2 6-3 9-1v14c-3-2-6-1-9 1-3-2-6-3-9-1Z"/><path d="M12 6v14"/>',sound:'<path d="M11 4 6 8H3v8h3l5 4Z"/><path d="M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/>',mute:'<path d="M11 4 6 8H3v8h3l5 4Z"/><path d="m16 9 5 6m0-6-5 6"/>'};return `<svg width="22" height="22" viewBox="0 0 24 24" ${s} aria-hidden="true">${paths[name]}</svg>`;}
function header(){return `<header><button class="brand" onclick="goHome()" aria-label="Word Trail home"><span class="brand-icon">${icon('book')}</span><span><b>Word Trail</b><small>READ. FIND. CONNECT.</small></span></button><nav aria-label="Main navigation"><button class="plain-btn" onclick="showHelp()">How to play</button><button class="plain-btn" onclick="goTeacher()">Teacher view</button><span class="coin" title="10 coins for each question mastered"><i aria-hidden="true">✦</i><span>${saved.mastered.length*10}</span></span><button class="icon-btn" onclick="toggleSound()" aria-label="${saved.sound?'Mute sounds':'Turn sounds on'}" aria-pressed="${saved.sound}">${icon(saved.sound?'sound':'mute')}</button></nav></header>`;}
function footer(){return `<footer class="footer"><span>Created by Ms. Amina Qatan · Vocational English · Levels 1–3</span><span><button class="text-btn" onclick="goTeacher()">Teacher view</button> &nbsp;·&nbsp; <button class="text-btn" onclick="showHelp()">How to play</button> &nbsp;·&nbsp; Progress stays on this device.</span></footer>`;}
function heroArt(){return `<svg viewBox="0 0 490 290" role="img" aria-label="A winding trail connecting three reading skills"><ellipse cx="253" cy="161" rx="210" ry="122" fill="#e9ece0"/><path d="M66 222C103 284 231 237 224 174S377 171 402 66" stroke="#cbd5c4" stroke-width="35" fill="none" stroke-linecap="round"/><path d="M66 222C103 284 231 237 224 174S377 171 402 66" stroke="#fffdf5" stroke-width="3" stroke-dasharray="6 10" fill="none"/><g transform="translate(32 55) rotate(-8)"><rect width="160" height="86" rx="16" fill="#c3d9c8" transform="translate(0 5)"/><rect width="160" height="86" rx="16" fill="#fffefa"/><circle cx="29" cy="30" r="15" fill="#e1eee2"/><text x="29" y="36" text-anchor="middle" fill="#245c48" font-family="Arial" font-size="20">=</text><text x="16" y="65" fill="#273935" font-family="Arial" font-size="17" font-weight="bold">Same meaning</text></g><g transform="translate(286 28) rotate(9)"><rect width="154" height="86" rx="16" fill="#d0c5e5" transform="translate(0 5)"/><rect width="154" height="86" rx="16" fill="#eee8f9"/><circle cx="29" cy="30" r="15" fill="#d8ccea"/><text x="29" y="35" text-anchor="middle" fill="#685185" font-family="Arial" font-size="18">↔</text><text x="16" y="66" fill="#4e3e62" font-family="Arial" font-size="17" font-weight="bold">Opposite meaning</text></g><g transform="translate(238 204) rotate(-4)"><rect width="177" height="76" rx="16" fill="#e4cbb0" transform="translate(0 5)"/><rect width="177" height="76" rx="16" fill="#f9e6cf"/><circle cx="30" cy="28" r="14" fill="#edd3b4"/><text x="30" y="34" text-anchor="middle" fill="#8b5335" font-family="Arial" font-size="21">↗</text><text x="16" y="58" fill="#79533b" font-family="Arial" font-size="17" font-weight="bold">Find the reference</text></g><g transform="translate(128 175) rotate(-12)"><circle r="28" fill="#245c48"/><path d="m0-18 8 23-8-5-8 5Z" fill="#f4e9c5"/><circle r="4" fill="#245c48"/></g><path d="m239 58 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="#afbc93"/><path d="m432 164 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#b5a2c8"/></svg>`;}
function stageArt(n){if(n===1)return `<svg viewBox="0 0 150 130" aria-hidden="true"><circle cx="98" cy="38" r="22" fill="#f5dfa1"/><path d="M10 106 60 34 107 106Z" fill="#8aaf91"/><path d="m67 106 34-50 39 50Z" fill="#b5ccad"/><path d="m53 108 8-18-3-14 8-20" fill="none" stroke="#fff9e9" stroke-width="8"/><path d="M63 25v29m0-29 25 9-25 7" stroke="#3b6851" fill="#3b6851" stroke-width="3"/></svg>`;if(n===2)return `<svg viewBox="0 0 150 130" aria-hidden="true"><rect x="19" y="63" width="107" height="48" rx="10" fill="#aa96c6"/><path d="M54 61V44h37v17" fill="none" stroke="#6f568f" stroke-width="9"/><path d="M17 83h113" stroke="#6f568f" stroke-width="5"/><rect x="63" y="76" width="19" height="14" rx="4" fill="#f8e7b5"/><circle cx="113" cy="35" r="21" fill="#f9f5ff"/><path d="m103 35 7 7 13-15" stroke="#795f9a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;return `<svg viewBox="0 0 150 130" aria-hidden="true"><circle cx="76" cy="62" r="45" fill="#f5f0d9" stroke="#bd8660" stroke-width="3"/><ellipse cx="76" cy="62" rx="23" ry="45" fill="none" stroke="#dab48c" stroke-width="2"/><path d="M31 62h90m-83-24h76m-76 49h76M76 17v90" stroke="#dab48c" stroke-width="2"/><path d="m38 43 17-10 10 5 1 17 17 9-4 17-17 15-8-13 4-15-17-3Zm65 6 16 2-7 25-12-6-5-13Z" fill="#8da88c"/><path d="M25 109c57 12 108-50 109-65" fill="none" stroke="#9f694b" stroke-width="4" stroke-linecap="round"/><path d="m131 32 2 10 10 2-9 4-4 9-2-10-10-2 9-4Z" fill="#9f694b"/></svg>`;}
function home(){return `<main class="screen-enter" id="main"><section class="hero"><div><div class="eyebrow">A little reading. A new discovery.</div><h1 tabindex="-1">Every word<br>is a <em>clue.</em></h1><p>Follow the passage. Find the meaning. Connect the pronoun. Your next reading adventure starts here.</p><div class="stats"><div class="stat"><b>3</b><span>curriculum stages</span></div><div class="stat"><b>64</b><span>short passages</span></div><div class="stat"><b>192</b><span>reading questions</span></div></div></div><div class="art">${heroArt()}</div></section><div class="section-head"><div><h2>Choose your trail</h2><p>All three levels are open. Start where you belong.</p></div>${saved.missed.length?`<button class="text-btn" onclick="reviewMissed()">Practise missed (${saved.missed.length})</button>`:''}</div><section class="stages" aria-label="Choose a curriculum stage">${[1,2,3].map(n=>{let qs=ALL_Q.filter(q=>q.p.level===n),done=qs.filter(mastered).length;return `<article class="stage"><div class="stage-top"><span class="stage-num">STAGE 0${n} · LEVEL ${n}</span><span class="stage-mark" aria-hidden="true">0${n}</span>${stageArt(n)}</div><div class="stage-body"><h3>${STAGE_NAMES[n-1]}</h3><p>${STAGE_COPY[n-1]}</p><div class="progress-label"><span>${BANK.units[n].length} units · ${qs.length} questions</span><span>${done===qs.length?'✦ Complete':Math.round(done/qs.length*100)+'%'}</span></div><div class="bar" role="progressbar" aria-label="Level ${n} mastered" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${qs.length}"><span style="width:${done/qs.length*100}%"></span></div><button class="primary" onclick="openLevel(${n})">${done?'Continue':'Explore'} Level ${n} &nbsp; →</button></div></article>`;}).join('')}</section><section class="skill-strip" aria-label="Reading skills"><div class="skill-item"><span class="skill-icon">=</span><div><b>Find a synonym</b><p>A word with a similar meaning.</p></div></div><div class="skill-item"><span class="skill-icon">↔</span><div><b>Find an antonym</b><p>A word with the opposite meaning.</p></div></div><div class="skill-item"><span class="skill-icon">↗</span><div><b>Follow a pronoun</b><p>Find the person or thing it refers to.</p></div></div></section></main>`;}
function levelScreen(){let n=state.level,qs=ALL_Q.filter(q=>q.p.level===n),done=qs.filter(mastered).length;return `<main id="main" class="screen-enter"><button class="back" onclick="goHome()">← All trails</button><div class="level-head"><div><div class="eyebrow">Stage 0${n} · Level ${n}</div><h1 tabindex="-1">${STAGE_NAMES[n-1]}</h1><p>${STAGE_COPY[n-1]}</p><p class="saved-note">${done} / ${qs.length} questions mastered${done===qs.length?' · Level badge earned!':''}</p></div><div class="badge-round" aria-label="${done===qs.length?'Level badge earned':'Your level badge'}">${done===qs.length?'✦':n===1?'⚑':n===2?'⌕':'◎'}</div></div><div class="practice-controls"><div><div class="top-label" style="margin-bottom:8px">What would you like to practise?</div><div class="segments" role="group" aria-label="Reading skill">${['all',...TYPES].map(t=>`<button class="segment ${state.skill===t?'active':''}" aria-pressed="${state.skill===t}" onclick="setSkill('${t}')">${t==='all'?'Mixed skills':TYPE_NAMES[t]}</button>`).join('')}</div></div><button class="secondary" onclick="startRound(null,true)">Quick round · ${state.skill==='all'?9:3} questions →</button></div><div class="section-head"><div><h2>Choose a unit</h2><p>Read a two-sentence passage, then follow its clues.</p></div></div><div class="units">${BANK.units[n].map((name,i)=>{let list=qs.filter(q=>q.p.unit===i+1&&(state.skill==='all'||q.type===state.skill)),d=list.filter(mastered).length;return `<button class="unit" onclick="startRound(${i+1},false)"><span class="unit-number">${String(i+1).padStart(2,'0')}</span><span class="unit-copy"><b>${esc(name)}</b><small>${list.length} questions · ${d} mastered</small><span class="bar"><span style="width:${d/list.length*100}%"></span></span></span><span aria-hidden="true">→</span></button>`;}).join('')}</div><p class="saved-note">Earn 10 coins the first time you answer a question correctly. Complete every question in a level to earn its badge.</p></main>`;}
function goHome(){if(state.screen==='game'&&!state.session?.done){return confirmLeave('home');}state.screen='home';render();}
function openLevel(n){state.level=n;state.screen='level';state.skill='all';render();}
function setSkill(t){state.skill=t;render(false);}
function goTeacher(){if(state.screen==='game'&&!state.session?.done)return confirmLeave('teacher');state.screen='teacher';render();}
function confirmLeave(to){showModal('Leave this round?',`<p>Your answered questions and coins are saved. This unfinished round will end.</p><div class="button-row"><button class="primary" onclick="closeModal()">Keep reading</button><button class="secondary" onclick="leaveRound('${to}')">Leave round</button></div>`);}
function leaveRound(to){closeModal();state.session=null;state.screen=to;render();}
function startRound(unit,quick){let ps=BANK.passages.filter(p=>p.level===state.level&&(!unit||p.unit===unit));if(quick){let fresh=shuffle(ps.filter(p=>ALL_Q.some(q=>q.p.id===p.id&&(state.skill==='all'||q.type===state.skill)&&!mastered(q)))),other=shuffle(ps.filter(p=>!fresh.includes(p)));ps=[...fresh,...other].slice(0,3);}let queue=ps.flatMap(p=>ALL_Q.filter(q=>q.p.id===p.id&&(state.skill==='all'||q.type===state.skill)));launch(queue,quick?'Quick round':BANK.units[state.level][unit-1]);}
function launch(queue,label){if(!queue.length)return toast('No questions to practise yet.');state.session={queue:queue.map(q=>({...q,options:shuffle(q.choices)})),label,index:0,answers:[],selected:null,coins:0,streak:0,bestStreak:0,done:false};state.screen='game';render();}
function reviewMissed(){let list=ALL_Q.filter(q=>saved.missed.includes(q.id));if(!list.length)return toast('No missed questions. Choose a new trail!');launch(list,'Practice missed questions');}
function highlight(text,term,cls){const escaped=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('\\b('+escaped+')\\b','gi');let parts=[],i=0;for(const m of text.matchAll(re)){parts.push(esc(text.slice(i,m.index)),`<mark class="${cls}">${esc(m[0])}</mark>`);i=m.index+m[0].length;}parts.push(esc(text.slice(i)));return parts.join('');}
function questionText(q){return q.type==='reference'?`What does <strong>“${esc(q.target)}”</strong> refer to?`:`Find a word in the passage with ${q.type==='synonym'?'a similar':'the opposite'} meaning to <strong>“${esc(q.target)}”</strong>.`;}
function explanation(q){return q.type==='reference'?`“${q.target}” refers to ${q.answer}. Read the words before the pronoun to find the connection.`:q.type==='synonym'?`“${q.answer}” has a similar meaning to “${q.target}” in this passage.`:`“${q.answer}” has the opposite meaning to “${q.target}” in this passage.`;}
function sourceLabel(p){let offset=p.level===1?8:p.level===2?7:0;return `Book ${p.pages.length===1?'p.':'pp.'} ${p.pages.map(n=>n-offset).join(', ')} · PDF ${p.pages.length===1?'p.':'pp.'} ${p.pages.join(', ')}`;}
function gameScreen(){let s=state.session,q=s.queue[s.index],answered=s.selected!==null,correct=answered&&s.selected===q.answer;let text=answered?highlight(q.p.passage,q.answer,'answer'):q.type==='reference'?highlight(q.p.passage,q.target,''):esc(q.p.passage);const finished=s.index+(answered?1:0);return `<main id="main" class="screen-enter"><div class="game-top"><button class="icon-btn" aria-label="Leave round" onclick="confirmLeave('level')">←</button><small>${s.index+1} / ${s.queue.length}</small><div class="bar" role="progressbar" aria-label="Round progress" aria-valuenow="${finished}" aria-valuemin="0" aria-valuemax="${s.queue.length}"><span style="width:${finished/s.queue.length*100}%"></span></div><span class="score-bubble">${s.answers.filter(a=>a.correct).length} correct</span></div><div class="game-grid"><article class="reading-card"><div class="eyebrow">Level ${q.p.level} · Unit ${q.p.unit}</div><h2>${esc(q.p.title)}</h2><div class="passage" aria-label="Reading passage">${text}</div><div class="source-small">Two sentences · Adapted practice<br>${sourceLabel(q.p)}</div></article><section class="question-panel" aria-label="Reading question"><span class="type-pill ${q.type}">${TYPE_NAMES[q.type]}</span><h2 id="question-heading" tabindex="-1">${questionText(q)}</h2><p class="question-note">${q.type==='reference'?'Follow the pronoun back to a person or thing.':'Choose the answer from the passage.'}</p><div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(o===q.answer?'correct':o===s.selected?'wrong':''):''}" ${answered?'disabled':''} onclick="answer(${i})"><span class="letter">${answered&&o===q.answer?'✓':answered&&o===s.selected?'×':String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="feedback ${correct?'':'wrong'}" role="status"><b>${correct?'You found it!':'Keep exploring — here is the connection.'} ${correct&&s.answers.at(-1).earned?'+10 coins':''}</b><p>${esc(explanation(q))}</p></div><button id="next-button" class="primary next-btn" onclick="nextQuestion()">${s.index===s.queue.length-1?'See my results':'Next clue'} &nbsp; →</button>`:''}<div class="session-foot"><span>${s.streak>1?'✦ '+s.streak+' in a row':'Take your time. Read again.'}</span><span class="dots" aria-label="${TYPE_NAMES[q.type]}">${TYPES.map(t=>`<span class="dot ${t===q.type?'active':''}"></span>`).join('')}</span></div></section></div><p class="game-tip">No timer. Every passage holds the answer. <span class="desktop-tip">Keyboard: 1–3 to answer, Enter to continue.</span></p></main>`;}
function answer(index){let s=state.session;if(state.screen!=='game'||!s||s.selected!==null)return;let q=s.queue[s.index],selected=q.options[index];if(selected===undefined)return;let correct=selected===q.answer,earned=correct&&!mastered(q);s.selected=selected;s.answers.push({q,selected,correct,earned});if(correct){if(earned){saved.mastered.push(q.id);s.coins+=10;}saved.missed=saved.missed.filter(x=>x!==q.id);s.streak++;s.bestStreak=Math.max(s.streak,s.bestStreak);}else{if(!saved.missed.includes(q.id))saved.missed.push(q.id);s.streak=0;}save();sound(correct?'correct':'wrong');render(false);$('#next-button')?.focus({preventScroll:true});}
function nextQuestion(){let s=state.session;if(!s||s.selected===null||s.done)return;if(s.index===s.queue.length-1){s.done=true;state.screen='result';render();return;}s.index++;s.selected=null;render();}
function resultScreen(){let s=state.session,correct=s.answers.filter(a=>a.correct).length,pct=Math.round(correct/s.queue.length*100),missed=s.answers.filter(a=>!a.correct);return `<main id="main" class="result screen-enter"><div class="result-icon" aria-hidden="true">${pct===100?'✦':pct>=60?'❋':'⚑'}</div><div class="eyebrow">${esc(s.label)} · Complete</div><h1 tabindex="-1">${pct===100?'A perfect trail!':pct>=60?'Look how far you came.':'Every clue is practice.'}</h1><p>${pct===100?'You connected every clue in this round. Ready for another adventure?':missed.length+' question'+(missed.length===1?' needs':'s need')+' another look. Read the feedback, then try again.'}</p><div class="result-stats"><div><b>${correct}/${s.queue.length}</b><span>correct answers</span></div><div><b>+${s.coins}</b><span>new coins</span></div><div><b>${s.bestStreak}</b><span>best streak</span></div></div><div class="button-row">${missed.length?'<button class="primary" onclick="retryRoundMissed()">Try missed questions →</button>':'<button class="primary" onclick="openLevel(state.level)">Choose another unit →</button>'}<button class="secondary" onclick="goHome()">All trails</button><button class="text-btn" onclick="replayRound()">Replay round</button></div>${missed.length?`<div class="review-list"><div class="section-head"><h2>Your reading notes</h2></div>${missed.map(a=>`<article class="review-card"><small>Level ${a.q.p.level} · ${esc(a.q.p.title)} · ${TYPE_NAMES[a.q.type]}</small><p>${esc(a.q.p.passage)}</p><div>${esc(explanation(a.q))}</div></article>`).join('')}</div>`:''}<p class="saved-note">${storageAvailable?'Your progress is saved on this browser and device.':'This browser could not save progress. Keep this tab open to continue.'}</p></main>`;}
function retryRoundMissed(){let old=state.session;launch(old.answers.filter(a=>!a.correct).map(a=>a.q),'Try again');}
function replayRound(){launch(state.session.queue,state.session.label);}
function teacherScreen(){let rows=BANK.passages.filter(p=>(state.teacherLevel==='all'||p.level===+state.teacherLevel)&&(!state.search||(p.passage+' '+p.title+' '+TYPES.flatMap(t=>p[t]).join(' ')).toLowerCase().includes(state.search.toLowerCase())));let types=state.teacherType==='all'?TYPES:[state.teacherType];return `<main id="main" class="screen-enter"><button class="back" onclick="goHome()">← Back to the game</button><div class="level-head"><div><div class="eyebrow">Teacher view · Question bank & sources</div><h1 tabindex="-1">The words behind the trail.</h1><p>64 two-sentence passages. 192 questions. All 15 curriculum units.</p></div><button class="secondary" onclick="window.print()">Print bank</button></div><div class="teacher-intro"><b>How this bank is built</b><br>These are new, short practice passages using vocabulary checked against the original book for each level. They are not verbatim textbook extracts. Each passage has one synonym, one antonym, and one reference question. Source pages show the curriculum context; vocabulary may also occur elsewhere in the same book.</div><section class="sources"><h3>Original course books</h3><p><b>Level 1:</b> English for Vocational Education 1 · First Edition, 2024 · 5 units.</p><p><b>Level 2:</b> L2 Curriculum · 6 units.</p><p><b>Level 3:</b> Level three new system book — Final copy · 4 units.</p><details><summary>Content review & coverage notes</summary><p>The passages, target words, correct answers, and distractors have been checked against the words in their own level’s source book, including selected image-based pages. Interface instructions and feedback are teaching prompts.</p><p>The game covers every unit and includes checked word pairs from the books’ synonym and antonym exercises. It is a curated practice bank, not a claim to list every possible word relationship in the books.</p><p>Some source exercises need correction: “gratitude / angry” is not an antonym pair; “carefully / careless” mixes an adverb and an adjective. This game instead practises “careful / careless.” “Climate / weather” are not interchangeable, and “destruction / destroy” are different grammatical forms. Unclear source items are not presented as correct synonym pairs.</p><p>Pronoun practice includes subject, object, possessive, and relative forms. New sentences keep the intended reference clear. “Who” refers to people and “which” to a thing in the included examples.</p><p>Coin totals and completed questions are saved on this browser only. This is a practice game; the teacher view is open to students too.</p></details></section><div class="teacher-tools"><select aria-label="Filter by level" onchange="state.teacherLevel=this.value;render(false)"><option value="all">All levels</option>${[1,2,3].map(n=>`<option value="${n}" ${state.teacherLevel==n?'selected':''}>Level ${n}</option>`).join('')}</select><select aria-label="Filter by skill" onchange="state.teacherType=this.value;render(false)"><option value="all">All skills</option>${TYPES.map(t=>`<option value="${t}" ${state.teacherType===t?'selected':''}>${TYPE_NAMES[t]}</option>`).join('')}</select><input type="search" id="bank-search" aria-label="Search passages and words" placeholder="Find a word, passage, or unit…" value="${esc(state.search)}" oninput="filterBank(this.value)"></div><p class="top-label" id="bank-count">${rows.length} passages · ${rows.length*types.length} questions shown</p><div class="bank-list" id="bank-list">${bankCards(rows,types)}</div><div class="section-head"><p class="saved-note">${storageAvailable?'Progress is saved on this device.':'Progress cannot be saved in this browser.'}</p><button class="text-btn" onclick="confirmReset()">Reset this device’s progress</button></div></main>`;}
function bankCards(rows,types){if(!rows.length)return '<div class="empty-state">No matching passages. Try another word or level.</div>';return rows.map(p=>`<article class="bank-card"><span class="bank-label">Level ${p.level} · Unit ${p.unit} · ${esc(p.title)} · ${p.id.toUpperCase()}</span><p>${esc(p.passage)}</p><div class="bank-answers">${types.map(t=>`<div class="answer-chip"><span>${TYPE_NAMES[t]}</span>${esc(p[t][0])} ${t==='reference'?'↗':t==='synonym'?'≈':'↔'} <b>${esc(p[t][1])}</b></div>`).join('')}</div><div class="source-small">${sourceLabel(p)}</div></article>`).join('');}
function filterBank(v){state.search=v;let rows=BANK.passages.filter(p=>(state.teacherLevel==='all'||p.level===+state.teacherLevel)&&(!v||(p.passage+' '+p.title+' '+TYPES.flatMap(t=>p[t]).join(' ')).toLowerCase().includes(v.toLowerCase()))),types=state.teacherType==='all'?TYPES:[state.teacherType];$('#bank-count').textContent=`${rows.length} passages · ${rows.length*types.length} questions shown`;$('#bank-list').innerHTML=bankCards(rows,types);}
function confirmReset(){showModal('Start a fresh trail?',`<p>This will remove the coins, mastered questions, and missed-question list stored in this browser.</p><div class="button-row"><button class="primary" onclick="closeModal()">Keep my progress</button><button class="secondary" onclick="resetProgress()">Reset progress</button></div>`);}
function resetProgress(){saved.mastered=[];saved.missed=[];save();closeModal();state.screen='home';state.session=null;render();toast('Your trail is ready for a fresh start.');}
function showModal(title,body){$('#modal-content').innerHTML=`<h2 id="modal-title">${esc(title)}</h2>${body}`;$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function showHelp(){showModal('Three small steps. One new skill.',`<ol><li><b>Choose your level and unit.</b> All stages are open. Practise mixed skills or focus on one skill.</li><li><b>Read both sentences.</b> Find a word with a similar meaning, a word with the opposite meaning, or the person or thing a pronoun refers to.</li><li><b>Choose one answer.</b> Read the explanation, then follow the next clue. You can try missed questions again.</li></ol><p>Earn <b>10 coins</b> for each question you master for the first time. Complete all questions in a level to earn its badge. There is no timer and no penalty for trying.</p><p>Your progress is stored on this device. For a shared classroom screen, use Teacher view → Reset progress between groups.</p><button class="primary" onclick="closeModal()">Let’s explore →</button>`);}
function render(scroll=true){let content=state.screen==='home'?home():state.screen==='level'?levelScreen():state.screen==='game'?gameScreen():state.screen==='result'?resultScreen():teacherScreen();$('#app').innerHTML=`<div class="shell">${header()}${content}${footer()}</div>`;if(scroll){window.scrollTo(0,0);let el=state.screen==='game'?$('#question-heading'):$('main h1');el?.focus({preventScroll:true});}}
document.addEventListener('keydown',e=>{if($('#modal').open||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))return;if(state.screen==='game'){if(['1','2','3'].includes(e.key)){e.preventDefault();answer(+e.key-1);}else if(e.key==='Enter'&&state.session.selected!==null&&!['BUTTON','A'].includes(document.activeElement?.tagName||'')){e.preventDefault();nextQuestion();}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render(false);

</script></body></html>
